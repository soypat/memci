name: memci
description: Report benchmark allocation and binary size changes against the base branch.

# Runs in the pull request's context and so must be treated as untrusted: it
# builds and runs PR code. It takes no write permissions and only produces an
# artifact. Posting that to the PR is memci/comment's job.

inputs:
  args:
    description: Flags for memci. Run memci -h for the list.
    default: ""
  bindiff:
    description: Module version of bindiff to install, or a command to run.
    default: github.com/soypat/tinyboot/cmd/bindiff@latest
  targets:
    # An input of its own rather than part of args because args is word-split by
    # the shell, which a JSON document does not survive. Any toolchain a build
    # command names must be installed by the workflow, e.g. acifani/setup-tinygo.
    description: |
      Builds to size-profile: either a JSON array, or the path of a .json file
      in the repo holding one. Each entry is one binary:
        build - shell command, run from the root of each checkout
        elf   - where build leaves the binary, relative to the checkout
        name  - label in the report, defaults to the elf's base name
        mem   - measure the loadable image plus .bss instead of the file
    default: ""

runs:
  using: composite
  steps:
    - shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        HEAD: ${{ github.head_ref || github.ref_name }}
        ARGS: ${{ inputs.args }}
        BINDIFF: ${{ inputs.bindiff }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        git fetch --no-tags --depth=1 origin "+refs/heads/${BASE}:refs/memci/base"
        git worktree add --detach "${RUNNER_TEMP}/base" refs/memci/base
        # Build memci from this action's own checkout so the tool and the action
        # version cannot drift apart.
        (cd "${GITHUB_ACTION_PATH}" && go build -o "${RUNNER_TEMP}/memci" .)
        if [ "${BINDIFF}" != "${BINDIFF#*@}" ]; then
          GOBIN="${RUNNER_TEMP}" go install "${BINDIFF}"
          BINDIFF="${RUNNER_TEMP}/bindiff"
        fi
        # An array so the JSON stays one argument. Without a list, every main
        # package gets a host build; naming one replaces that rather than
        # adding to it. Pass -targets in args to have both.
        TARGET_ARGS=()
        if [ -n "${TARGETS}" ]; then
          TARGET_ARGS+=(-targets-json "${TARGETS}")
        else
          TARGET_ARGS+=(-targets ./...)
        fi
        "${RUNNER_TEMP}/memci" -base "${RUNNER_TEMP}/base" \
          -base-ref "${BASE}" -head-ref "${HEAD}" -bindiff "${BINDIFF}" \
          ${TARGET_ARGS[@]+"${TARGET_ARGS[@]}"} \
          ${ARGS} -o "${RUNNER_TEMP}/memci-report.md"

    - if: always()
      shell: bash
      run: |
        # memci may have failed before writing anything. The step that failed
        # has already said why; a second red X for a missing file only buries
        # it, so the summary is written when there is one and skipped when not.
        if [ -f "${RUNNER_TEMP}/memci-report.md" ]; then
          cat "${RUNNER_TEMP}/memci-report.md" >> "${GITHUB_STEP_SUMMARY}"
        else
          echo "memci wrote no report; see the failure above." >> "${GITHUB_STEP_SUMMARY}"
        fi

    - if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: memci-report
        path: ${{ runner.temp }}/memci-report.md
        if-no-files-found: warn
