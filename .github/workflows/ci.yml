name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - run: test -z "$(gofmt -l .)" || { gofmt -l -d .; exit 1; }

      - run: go vet ./...

      # The end-to-end tests need a real bindiff; without one they skip, which
      # would leave the size half untested.
      - run: go install github.com/soypat/tinyboot/cmd/bindiff@latest

      # Likewise for TinyGo: the two-toolchain report is only exercised when a
      # tinygo is on PATH.
      - uses: acifani/setup-tinygo@db56321a62b9a67922bb9ac8f9d085e218807bb3 # v2
        with:
          tinygo-version: "0.42.0"
          install-binaryen: "false"

      - run: go test ./...
